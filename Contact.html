<!DOCTYPE html>
<html>

<head>
    <title>
        Contact Form
    </title>
    <link rel="stylesheet" href="contact.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
</head>
</head>

<body>
    <div class="container">
        <div class="section-one">
            <h1 class="section-one__name">
                Neethirajah Jatharththan
            </h1>

            <p class="section-one__role"> Software Engineer | Full Stack Developer</p>

            <a class="section-one__btn" href="portfolio.html" class="button">
                Home
            </a>
        </div><br>

        <br>
        <div class="contact-form">
            <form>
                <table>
                    <tr>
                        <td>Name:</td>
                        <td><input class="contact-form__input" style="border: none ;  border-bottom:solid 1px ;" type="text"
                                placeholder="Your Name">
                        </td>
                    </tr>
                    <tr>
                        <td>Email:</td>
                        <td><input class="contact-form__input" style="border: none ;  border-bottom:solid 1px ;" type="email"
                                placeholder="Your Mail">
                        </td>
                    </tr>
                    <tr>
                        <td>Message:</td>
                        <td><textarea class="contact-form__textarea" rows="4" cols="30" placeholder="Your Message"></textarea></td>
                    </tr>
                    <div class="section-two__submit">
                        <tr>
                            <td></td>
                            <td><input class="contact-form__submit" class="submit" type="submit"></td>
                        </tr>
                    </div>

                </table>
            </form><br>


        </div>

        <div class="section-three">
            <p class="section-three__link">
                Social Media:
                <a href="https://www.instagram.com/" target="_blank">Instagram</a> <a
                    href="https://www.linkedin.com/in/vrtnjathartan26/" target="_blank">LinkedIn</a>
            </p>
            <P>&copy;Neethirajah Jatharththan</P>
        </div>

    </div>

</body>

</html>
